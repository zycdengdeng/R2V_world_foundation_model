<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1030" role="img" aria-label="R2A 多视角可控生成完整架构：三路条件经冻结VAE编码并按槽位拼接，可训练控制分支在冻结Cosmos主干的第0/7/14/21块注入可加残差">
