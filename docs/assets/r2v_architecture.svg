  <text x="750" y="56" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6B7280">7 视角 × 29 帧 × 720p ·  潜空间 16ch × (7×8) × 90 × 160  ·  token 序列 ≈ 20 万</text>

